<html lang="en">
<head>

    <style>

        .button-brothers {
            display: flex;
            position: fixed;
            bottom: 0;
            right: 0;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        button#compliments-and-insults {
            background-image: url(asset/web-icon/compliment_insult_light.png);
            color: white;
        }

        button#day {
            color: white;
            background-image: url(asset/web-icon/days-day-light.png);
        }

        button#pdf {
            color: rgb(127, 127, 127);
            padding: 5px 10px;
            cursor: not-allowed;
        }

        button#pdf:hover {
            transform: scale(1);
        }

        button#sound {
            background-image: url(asset/web-icon/soundboard_light.png);
            color: white;
        }

        @media (prefers-color-scheme: dark) {
            button#compliments-and-insults {
                background-image: url(asset/web-icon/compliment_insult_dark.png);
            }

            button#day {
                background-image: url(asset/web-icon/days-day-dark.png);
            }

            button#sound {
                background-image: url(asset/web-icon/soundboard_dark.png);
            }
        }

    </style>
</head>
<body>
    <h1 id="welcome"></h1>

    <h1>Please click on the available website below:</h1>
    <a href="./websites/compliments-and-insults/"><button id="compliments-and-insults">Compliments & Insults</button></a>
    <a href="./websites/days-until-day/"><button id="day">Days Until Day</button></a>

    <a href="./games/"><button id="game">Games</button></a>
    <a href="./tools/"><button id="tool">Tools</button></a>

    <h1 style="margin-top: 5pc;">Old/Deprecated:</h1>
    <button disabled id="pdf" title="Deprecated as of 8 Mar. 2026, 17:22 UTC">Math PDF Files</button>
    <a href="websites/old-math-website/"><button id="old-math-website">Recovered Math Website (STYLE WARNING)</button></a>

    <h1 style="margin-top: 20pc;">Still can't choose?</h1>
    <button onclick="iDontKnowWhereToGo()">"I'm feeling lucky!" - Google, 1998</button>
    
    <script>
        console.log("Navya is a Bandar!");

        let welcomeText = document.getElementById("welcome");
        let url = window.location.origin;

        if (url != null) {
            if (url.includes("https://")) {
                url = url.replace("https://", "");
            } else if (url.includes("http://")) {
                url = url.replace("http://", "");
            }

            // List of if-statements
            if (url.includes("/")) url = url.replace("/", "");
            if (url.includes("index.html")) window.open(".", "_self");

            welcomeText.textContent = `Welcome to ${url}`;
        }


        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);

        if (urlParams.get('p') !== null) {
            if (urlParams.get('p').toLowerCase() === 'rr') {
                const newWindow = window.open("https://www.youtube.com/watch?v=QDia3e12czc", "_self");

                if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                    alert("Popup blocked! Please allow popups or use the link on the page.");
                }
            }
        }
        
        let websiteShortcut = urlParams.get('w')?.toLowerCase();
        if (websiteShortcut != null) websiteShortcut = websiteShortcut.toLowerCase();

        // List of shortcuts you can use to access website more easily!
        // Just put '?w=[case value]' (no single-quote) to the end of the URL to access them (NOT CASE-SENSITIVE)!
        switch (websiteShortcut) {
            case "calculator":
                window.open("./websites/tools/calculator", "_self");
                break;
            case "sb":
            case "soundboard":
                if (urlParams.get('i') !== null) {
                    window.open(`./websites/soundboard/?i=${urlParams.get('i').toLowerCase()}`, "_self");
                    break;
                }
                window.open(`./websites/soundboard/`, "_self");
                break;
            case "recover":
            case "recover-links":
            case "links":
                window.open("./websites/recover-links/", "_self");
                break;
            case "random":
            case "random-links":
            case "random-link":
            case "randomizer":
            case "generator":
                window.open("./websites/generator/", "_self");
                break;
            case "ci":
            case "compliment":
            case "compliments":
            case "insult":
            case "insults":
            case "compliment and insult":
            case "compliments and insult":
            case "compliment and insults":
            case "compliments and insults":
                if (urlParams.get('message') !== null) {
                    window.open(`./websites/compliments-and-insults/?message=${urlParams.get('message')}`, "_self");
                    break;
                } else if (urlParams.get('m') !== null) {
                    window.open(`./websites/compliments-and-insults/?m=${urlParams.get('m')}`, "_self");
                    break;
                }

                window.open(`./websites/compliments-and-insults/`, "_self");
                break;
            case "day":
            case "days":
            case "until":
            case "day until days":
            case "day until day":
            case "days until date":
            case "day until date":
                window.open("./websites/days-until-day/", "_self");
                break;
            case "fact":
            case "facts":
            case "funfact":
            case "funfacts":
            case "fun fact":
            case "fun facts":
                window.open("./websites/facts", "_self");
                break;
            case "tool":
            case "tools":
                window.open("./tools", "_self");
                break;
            case "window-open":
                if (urlParams.get('link') !== null) {
                    var newWindow = window.open(urlParams.get('link'), "_blank", "width=1250,height=1000,resizable=yes,scrollbars=no,status=yes");
                    
                    if (newWindow) {
                        newWindow.focus();
                    }
                }

                window.open("./tools/open-link-in-window#make-your-own", "_self");
                break;
            case "games":
                if (urlParams.get('game') !== null) {
                    window.open(`/games/?game=${urlParams.get('game')?.toLowerCase()}`, "_self");
                    break;
                }
        }

        let tableOfURLS = [];

        async function loadJson(path) {
            try {
                const response = await fetch(path);
                if (!response.ok) throw Error(response.status);
                return await response.json();
            } catch (error) {
                console.error("Failed to load external sites:", error);
                return [];
            }
        }

        async function iDontKnowWhereToGo() {
            tableOfURLS = await loadJson('/asset/configuration/htmlPages_main.json');
            const randomUrl = tableOfURLS[Math.floor(Math.random() * tableOfURLS.length)];
            window.open(randomUrl.toString(), "_self");
        }

    </script>
    <div class="button-brothers">
        <a href="credits/"><button class="small-button">Credits</button></a>
        <a href="about-developer/"><button class="small-button">About the Developer</button></a>
    </div>
</body>
