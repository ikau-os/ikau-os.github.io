<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../asset/src/style.css">
    <link rel="stylesheet" href="../../asset/src/IndentPages.css">
    <link rel="shortcut icon" href="Resources/favicon.ico" type="image/x-icon">
    <title>Days Until Day</title>

    <script>if (window.location.href.includes('index.html')) window.open(".", "_self");</script>

    <style>

        input, select {
            font-size: 20px;
            padding: 0.6%;
            height: 50%;
            width: 200px;
            text-align: center;
            border: none;
            border-radius: 7px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            box-shadow: none;
        }

        @media (prefers-color-scheme: dark) {
            input, select {
                background-color: rgb(30, 30, 30);
                color: white;
            }
        }

    </style>
</head>
<body>
    <button class="top-left-button" onclick="history.back()">Back</button>
    <h1>Please type below to get the number of days from date:</h1>
    <h1 id="output">ERROR? (Please Refresh!)</h1>
    
    <select id="mm" name="Month" style="width: 200px; font-size: 20px;">
        <option value="" disabled selected hidden>Month*</option>
        <option value="01">January</option>
        <option value="02">February</option>
        <option value="03">March</option>
        <option value="04">April</option>
        <option value="05">May</option>
        <option value="06">June</option>
        <option value="07">July</option>
        <option value="08">August</option>
        <option value="09">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
    </select>

    <input class="indent TopIndent" type="number" placeholder="Day*" id="dd" value="1" min="1" max="31" oninput="if(this.value > 31) this.value = 31;">
    <input class="indent TopIndent" type="number" placeholder="Year" id="yy">
    <input class="indent TopIndent" type="text" placeholder="Name" id="label" max="10">

    <br>
    <button id="clear" onclick="ClearAll()">Clear All</button>
    <button onclick="SubmitRequest()" class="indent TopIndent">Submit</button>
    <h1>* Required</h1>

    <div style="margin-top: 20pc;"></div>

    <h1 id="range">Get range of days:</h1>
    <h1 id="output1">ERROR? (Please Refresh!)</h1>
    <select id="mm1" name="Month" style="width: 200px; font-size: 20px;">
        <option value="" disabled selected hidden>Month*</option>
        <option value="01">January</option>
        <option value="02">February</option>
        <option value="03">March</option>
        <option value="04">April</option>
        <option value="05">May</option>
        <option value="06">June</option>
        <option value="07">July</option>
        <option value="08">August</option>
        <option value="09">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
    </select>

    <input class="indent TopIndent" type="number" placeholder="Day*" id="dd1" value="1" min="1" max="31" oninput="if(this.value > 31) this.value = 31;">
    <input class="indent TopIndent" type="number" placeholder="Year" id="yy1">

    <div style="margin-top: 2pc;"><h1>-</h1></div>

    <select id="mm2" name="Month" style="width: 200px; font-size: 20px;">
        <option value="" disabled selected hidden>Month*</option>
        <option value="01">January</option>
        <option value="02">February</option>
        <option value="03">March</option>
        <option value="04">April</option>
        <option value="05">May</option>
        <option value="06">June</option>
        <option value="07">July</option>
        <option value="08">August</option>
        <option value="09">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
    </select>

    <input class="indent TopIndent" type="number" placeholder="Day*" id="dd2" value="1" min="1" max="31" oninput="if(this.value > 31) this.value = 31;">
    <input class="indent TopIndent" type="number" placeholder="Year" id="yy2">

    <br>
    <button id="clear1" onclick="clearAllRange()">Clear All</button>
    <button onclick="getDaysFromRange()" class="indent TopIndent">Submit</button>
    <h1>* Required</h1>

    <script src="Resources/script.js"></script>
</body>
</html>
